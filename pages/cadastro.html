<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Rede Raízes</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  
<header class="cabecalho-site">
  <div class="conteudo-cabecalho">
    <a class="logotipo" href="unidades.html">Rede Raízes</a>

    <nav class="navegacao">
      <a href="unidades.html">Início</a>
      <a href="cardapio.html">Cardápio</a>
      <a href="fidelidade.html">Fidelidade</a>
      <a href="minha-conta.html">Minha Conta</a>
    </nav>

    <div class="lado-direito-cabecalho">
      <a href="carrinho.html">🛒 Carrinho [<span class="quantidade-carrinho">0</span>]</a>
      <a href="minha-conta.html">👤 <span class="nome-usuario">Entrar</span></a>
    </div>
  </div>
</header>


  <main class="conteudo">
    
<section class="secao-pagina estreito">
  <div class="cartao">
    <h1>Criar conta</h1>

    <form class="formulario" onsubmit="return cadastrar();">
      <div class="campo">
        <label>Nome completo</label>
        <input id="nome-cadastro" required>
      </div>

      <div class="campo">
        <label>E-mail</label>
        <input id="email-cadastro" type="email" required>
      </div>

      <div class="campo">
        <label>Telefone</label>
        <input id="telefone-cadastro">
      </div>

      <div class="campo">
        <label>Senha</label>
        <input type="password" required>
      </div>

      <div class="campo">
        <label>Confirmar senha</label>
        <input type="password" required>
      </div>

      <label class="marcacao">
        <input id="consentimento-privacidade" type="checkbox">
        Aceito a
        <a href="privacidade.html">Política de Privacidade</a>
        (obrigatório).
      </label>

      <label class="marcacao">
        <input id="consentimento-ofertas" type="checkbox">
        Quero receber ofertas e promoções.
      </label>

      <div id="erro-cadastro"></div>

      <button class="botao">Cadastrar</button>
      <a href="login.html">Já tenho conta — Entrar</a>
    </form>
  </div>
</section>

  </main>

  <footer class="rodape-site">
    Rede Raízes do Nordeste
  </footer>

  
<script src="../js/aplicacao.js"></script>
<script src="../js/cardapio.js"></script>
<script src="../js/pagamento.js"></script>
<script src="../js/privacidade.js"></script>
<script src="../js/conta.js"></script>


  
</body>
</html>
